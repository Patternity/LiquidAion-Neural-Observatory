name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # CPU-only software tests; no model weights are downloaded. GPU and real-model
    # acceptance are documented in docs/REPRODUCIBILITY.md and run locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for headless Qt and VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install --no-deps -e .
      - name: Cache the Qwen3 tokenizer only (no weights)
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          for name in ("tokenizer.json", "tokenizer_config.json", "vocab.json", "merges.txt", "config.json",
                       "generation_config.json"):
              hf_hub_download("Qwen/Qwen3-0.6B", name, revision="c1899de289a04d12100db370d81485cdf75e47ca")
          PY
      - name: Tests
        run: python -m pytest -q
      - name: Validate citation metadata
        run: |
          pip install cffconvert
          cffconvert --validate -i CITATION.cff
