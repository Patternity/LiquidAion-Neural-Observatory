name: Launchers

# Runs each download-and-run launcher from a clean checkout, exactly as a user would, in CPU
# mode (hosted runners have no GPU): installs uv, Python 3.12 and the pinned dependencies,
# then runs the headless test suite. No model weights are downloaded.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
            run: ./liquidaion-linux.sh --cpu --check
          - os: windows-2022
            shell: cmd
            run: call LiquidAion-Windows.bat --cpu --check
          - os: macos-14
            shell: bash
            run: bash ./LiquidAion-macOS.command --cpu --check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LIQUIDAION_NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for headless Qt and VTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Launcher (first run, CPU, headless check)
        shell: ${{ matrix.shell }}
        run: ${{ matrix.run }}
      - name: Launcher (second run reuses the environment)
        shell: ${{ matrix.shell }}
        run: ${{ matrix.run }}
